name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gr8r
          POSTGRES_USER: gr8r
          POSTGRES_PASSWORD: gr8r
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gr8r -d gr8r"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gr8r:gr8r@127.0.0.1:5432/gr8r?serverVersion=17&charset=utf8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: php bin/console doctrine:database:create --env=test --if-not-exists
      - run: php bin/console doctrine:migrations:migrate --env=test --no-interaction
      - run: php bin/console doctrine:schema:validate --env=test
      - run: php bin/phpunit
