name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run build:demo

  backend:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          # The tests' database: doctrine.yaml appends _test to the database name in DATABASE_URL.
          MARIADB_DATABASE: gr8r_test
          MARIADB_USER: gr8r
          MARIADB_PASSWORD: gr8r
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: mysql://gr8r:gr8r@127.0.0.1:3306/gr8r?serverVersion=10.11.14-MariaDB&charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl
          # above the 25 MB a File may be, so the test of a File of exactly 25 MB runs
          ini-values: upload_max_filesize=30M, post_max_size=32M
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: php bin/console doctrine:migrations:migrate --env=test --no-interaction
      - run: php bin/console doctrine:schema:validate --env=test
      - run: php bin/phpunit
