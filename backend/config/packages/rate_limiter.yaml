# How often the account endpoints may be called before they answer 429 too_many_requests
# (App\Security\RateLimits says which endpoint counts against which limiter, by what key).
framework:
    rate_limiter:
        # Signing in, per email address and IP; a successful sign-in starts over.
        sign_in:
            policy: sliding_window
            limit: 5
            interval: '1 minute'
        # Emails to one address: signing up, a new verification link, a password reset link, an Invite sent again.
        email:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'
        # Accepting one Invite link (which may check an existing account's password).
        link:
            policy: sliding_window
            limit: 5
            interval: '1 minute'
        # Each endpoint, per IP.
        ip:
            policy: sliding_window
            limit: 20
            interval: '1 minute'

# The browser checks run every flow from 127.0.0.1, and sign up several addresses a run: only the
# per-IP and per-address limits are raised, so six wrong passwords still answer 429.
when@dev:
    framework:
        rate_limiter:
            email:
                policy: sliding_window
                limit: 50
                interval: '15 minutes'
            ip:
                policy: sliding_window
                limit: 1000
                interval: '1 minute'
