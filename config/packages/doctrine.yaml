doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # The server version is in DATABASE_URL (see .env).
        default_table_options:
            charset: utf8mb4
            collation: utf8mb4_unicode_ci
        options:
            # Each statement sees what other transactions have committed, as on PostgreSQL before:
            # TaskHandler locks a Project and then reads its Task keys (ADR 0003), which under
            # MariaDB's default REPEATABLE READ would come from a snapshot taken before the lock.
            !php/const PDO::MYSQL_ATTR_INIT_COMMAND: 'SET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
